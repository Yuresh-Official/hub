<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LankaHub - Videos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; color: #fff; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .video-card:hover { transform: translateY(-5px); border-color: #f97316; }
        .stat-badge { background: rgba(249, 115, 22, 0.1); border: 1px solid rgba(249, 115, 22, 0.3); }

        /* අවුරුදු Animation සහ සුබපැතුම් styles */
        #splashScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #fce7b4; /* අවුරුදු තේමාවට ගැලපෙන කහ පාටක් */
            z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 1; transition: opacity 1s ease, visibility 1s ease;
        }
        #splashScreen.hidden { opacity: 0; visibility: hidden; }

        .swing-animation {
            width: 200px; /* ඇනිමේෂන් එකේ විශාලත්වය */
            height: auto;
            transform-origin: top center;
            animation: swing 2s ease-in-out infinite alternate;
        }

        @keyframes swing {
            0% { transform: rotate(-15deg); }
            100% { transform: rotate(15deg); }
        }

        .wishes-text {
            font-family: 'Times New Roman', Times, serif; /* සිංහල අකුරු සඳහා ගැලපෙන font එකක් */
            font-size: 3rem; font-weight: bold; color: #b91c1c; /* රතු පාට */
            margin-top: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            opacity: 0; animation: fadeIn 1.5s ease 0.5s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="font-sans">

    <div id="splashScreen">
        <img src="https://media1.tenor.com/m/fXjXU0iO34sAAAAC/sinhala-new-year-subha-aluth-avuruddak-wewa.gif" alt="Sinhala New Year Swing" class="swing-animation">
        
        <h1 class="wishes-text">සුබ අලුත් අවුරුද්දක් වේවා!</h1>
    </div>

    <nav class="sticky top-0 z-50 glass px-6 py-4 flex flex-col items-center gap-2">
        <h1 class="text-3xl font-black tracking-tighter text-orange-500">LANKA<span class="bg-orange-500 text-black px-1.5 rounded ml-1">HUB</span></h1>
        
        <div class="stat-badge px-4 py-1 rounded-full flex items-center gap-2">
            <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
            <span class="text-[11px] font-bold text-orange-200 uppercase tracking-widest">
                Total Visitors: <span id="visitorCount">...</span>
            </span>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        <h2 class="text-xl font-bold mb-10 flex items-center gap-2">
            <span class="w-1.5 h-6 bg-orange-500 rounded-full"></span> අලුත්ම නිර්මාණ
        </h2>

        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <p class="text-zinc-500 text-center col-span-full">පූරණය වෙමින් පවතී...</p>
        </div>
    </main>

    <script>
        const REPO_OWNER = 'Yuresh-Official'; 
        const REPO_NAME = 'hub'; 
        const FILE_PATH = 'videos.json';

        // SplashScreen එක පෙන්වන කාලය පාලනය කිරීම
        function hideSplashScreen() {
            setTimeout(() => {
                document.getElementById('splashScreen').classList.add('hidden');
            }, 3000); // තත්පර 3කට පස්සේ SplashScreen එක අයින් වෙනවා (3000ms = 3s)
        }

        function setupVisitorCount() {
            let count = localStorage.getItem('visitor_count') || 0;
            if (!sessionStorage.getItem('is_new_session')) {
                count = parseInt(count) + 1;
                localStorage.setItem('visitor_count', count);
                sessionStorage.setItem('is_new_session', 'true');
            }
            document.getElementById('visitorCount').innerText = count;
        }

        async function loadVideos() {
            const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${FILE_PATH}`;
            try {
                const res = await fetch(url + "?t=" + new Date().getTime());
                if (!res.ok) throw new Error();
                const videos = await res.json();
                const grid = document.getElementById('videoGrid');
                grid.innerHTML = '';

                videos.reverse().forEach((v) => {
                    const isImage = v.link.match(/\.(jpeg|jpg|gif|png)$/) != null || v.link.includes('tenor.com');
                    
                    const card = document.createElement('div');
                    card.className = "video-card group cursor-pointer bg-zinc-900/40 rounded-[2rem] overflow-hidden border border-white/5 p-3 transition-all duration-300";
                    card.onclick = () => window.open(v.link, '_blank');

                    card.innerHTML = `
                        <div class="relative aspect-video rounded-2xl overflow-hidden bg-black">
                            ${isImage ? 
                                `<img src="${v.link}" class="w-full h-full object-cover">` : 
                                `<div class="w-full h-full flex items-center justify-center bg-zinc-800 text-zinc-500">Watch Video</div>`
                            }
                            <div class="absolute inset-0 flex items-center justify-center bg-black/40 opacity-0 group-hover:opacity-100 transition">
                                <span class="bg-orange-500 text-black font-bold px-4 py-2 rounded-full text-xs">WATCH NOW</span>
                            </div>
                        </div>
                        <div class="p-4 text-center">
                            <h3 class="font-semibold text-zinc-100 text-base leading-tight group-hover:text-orange-500 transition">${v.title}</h3>
                        </div>`;
                    
                    grid.appendChild(card);
                });
            } catch (e) {
                document.getElementById('videoGrid').innerHTML = '<p class="text-zinc-500 text-center col-span-full">වීඩියෝ සොයා ගැනීමට නොහැකි විය.</p>';
            }
        }

        window.onload = () => {
            loadVideos();
            setupVisitorCount();
            hideSplashScreen(); // SplashScreen එක පෙන්වීමට call කරනවා
        };
    </script>
</body>
</html>
