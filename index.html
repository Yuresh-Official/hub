<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LankaHub - Videos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; color: #fff; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* අවුරුදු Splash Screen */
        #splashScreen {
            position: fixed; inset: 0; 
            background: linear-gradient(to bottom, #fde68a, #f97316); /* අවුරුදු තේමාවට කහ සහ තැඹිලි */
            z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s ease-out;
        }
        
        .avurudu-container { text-align: center; position: relative; }
        
        /* ඔංචිලි පදින ඇනිමේෂන් එකක් වැනි චලනයක් */
        .swing-girl {
            width: 280px; height: auto;
            animation: avuruduSwing 3s ease-in-out infinite;
        }
        
        @keyframes avuruduSwing {
            0% { transform: rotate(-10deg) translateY(0); }
            50% { transform: rotate(10deg) translateY(-20px); }
            100% { transform: rotate(-10deg) translateY(0); }
        }

        .wishes {
            font-size: 2.5rem; font-weight: 900; color: #7c2d12;
            margin-top: 20px; text-shadow: 0 2px 10px rgba(255,255,255,0.5);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body class="font-sans">

    <div id="splashScreen">
        <div class="avurudu-container">
            <img src="https://i.ibb.co/LzNf9Pz/avurudu-cartoon.png" onerror="this.src='https://media.tenor.com/fXjXU0iO34sAAAAC/sinhala-new-year-subha-aluth-avuruddak-wewa.gif'" class="swing-girl">
            <h1 class="wishes">සුබ අලුත් අවුරුද්දක් වේවා!</h1>
            <p class="text-orange-900 font-bold mt-2">රබන් සුරල් මැදින් කොහා ඇහෙන අවුරුද්දක්...</p>
        </div>
        
        <audio id="kohaSound" loop>
            <source src="https://www.soundboard.com/handler/DownLoadTrack.ashx?cliptoken=... " type="audio/mpeg">
        </audio>
    </div>

    <nav class="sticky top-0 z-50 glass px-6 py-4 flex flex-col items-center gap-2">
        <h1 class="text-3xl font-black tracking-tighter text-orange-500">LANKA<span class="bg-orange-500 text-black px-1.5 rounded ml-1">HUB</span></h1>
        <div class="bg-orange-500/10 border border-orange-500/30 px-4 py-1 rounded-full">
            <span id="visitorCount" class="text-xs font-bold text-orange-500 uppercase">Visitors: ...</span>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            </div>
    </main>

    <script>
        const REPO_OWNER = 'Yuresh-Official'; 
        const REPO_NAME = 'hub'; 
        const FILE_PATH = 'videos.json';

        // Splash screen එක අයින් කිරීම
        window.onload = () => {
            loadVideos();
            setupVisitorCount();
            
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 1000);
            }, 4000); // තත්පර 4ක් පෙන්වයි
        };

        async function loadVideos() {
            const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${FILE_PATH}`;
            try {
                const res = await fetch(url + "?t=" + new Date().getTime());
                const videos = await res.json();
                const grid = document.getElementById('videoGrid');
                grid.innerHTML = '';
                videos.reverse().forEach(v => {
                    const card = document.createElement('div');
                    card.className = "bg-zinc-900/50 p-4 rounded-3xl border border-white/5 cursor-pointer hover:border-orange-500 transition-all";
                    card.onclick = () => window.open(v.link, '_blank');
                    card.innerHTML = `<h3 class="text-center font-bold">${v.title}</h3>`;
                    grid.appendChild(card);
                });
            } catch (e) { console.log("Load error"); }
        }

        function setupVisitorCount() {
            let count = localStorage.getItem('v_count') || 0;
            if (!sessionStorage.getItem('s')) {
                count++;
                localStorage.setItem('v_count', count);
                sessionStorage.setItem('s', '1');
            }
            document.getElementById('visitorCount').innerText = "Total Visitors: " + count;
        }
    </script>
</body>
</html>
